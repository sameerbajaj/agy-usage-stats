<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ TITLE }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand-navy: #0E1018;
      --brand-card: #161926;
      --brand-card-stroke: #202436;
      --accent-green: #2EE680;
      --accent-purple: #998CFF;
      --accent-amber: #FF9E52;
      --accent-blue: #619EFF;
      --ink: #0E1018;
      --ink-soft: #4A4E69;
      --ink-mute: #7A809B;
      --line: #E2E4EC;
      --line-soft: #ECEEF6;
      --paper: #FFFFFF;
      --bg: #F5F6FA;
      --shadow-sm: 0 1px 3px rgba(14, 16, 24, 0.05);
      --shadow-md: 0 6px 24px -6px rgba(14, 16, 24, 0.1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 48px 36px 120px;
    }
    .doc-header {
      border-bottom: 1px solid var(--line);
      padding-bottom: 32px;
      margin-bottom: 48px;
    }
    .doc-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--brand-card);
      background: #E8EAF4;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    .doc-title {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 10px;
    }
    .doc-subtitle {
      font-size: 16px;
      color: var(--ink-soft);
      max-width: 760px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="doc-header">
      <span class="doc-eyebrow">AGY Usage Stats · Design Explorations</span>
      <h1 class="doc-title">{{ TITLE }}</h1>
      <p class="doc-subtitle">{{ SUBTITLE }}</p>
    </header>
    {{ CONTENT }}
  </div>
</body>
</html>
